name: Python and browser tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: test-only-ci-key-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q agents hplc_resolver cli.py enrichment.py simulator.py
      - name: Check baseline audit integrity
        run: python -c "from agents.base import AuditLogger; AuditLogger.log('CI','test','check',{'result':'ok'}); assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser script syntax
        run: |
          node --check web/peak-analysis.js
          node --check web/app.js
      - name: Test browser algorithm
        run: node --test tests/peak-analysis.test.cjs
